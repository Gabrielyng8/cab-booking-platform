<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabBook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /*  Navigation  */
        nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        nav button {
            padding: 8px 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        nav button.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        /*  Sections (only the .active one is shown)  */
        section {
            display: none;
        }

        section.active {
            display: block;
        }

        /*  Form controls  */
        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button[type=submit],
        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }

        /*  Cards (used in booking / location lists)  */
        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        /*  Status messages  */
        .error {
            color: red;
            margin-top: 8px;
        }

        .success {
            color: green;
            margin-top: 8px;
        }

        #fare-estimate {
            font-weight: bold;
            margin: 12px 0;
            font-size: 1.1em;
        }

        .fare-breakdown {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            font-size: 0.95rem;
        }

        .fare-breakdown h4 {
            margin: 0 0 8px;
        }

        .fare-breakdown .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 4px 0;
        }

        .fare-breakdown .row.total {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
            font-weight: bold;
        }

        .fare-breakdown .muted {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>


<body>

    <h1>🚖 CabBook</h1>

    <!-- Shows "Logged in as: <name>" when authenticated -->
    <div id="user-info" style="margin-bottom:12px; color:#555;"></div>

    <!--  Navigation  -->
    <nav>
        <button onclick="showSection('register')" id="nav-register">Register</button>
        <button onclick="showSection('login')" id="nav-login">Login</button>

        <!-- Auth-only buttons are hidden until the user logs in -->
        <button onclick="showSection('book')" id="nav-book" class="auth-only" style="display:none">Book a Cab</button>
        <button onclick="showSection('bookings'); loadBookings();" id="nav-bookings" class="auth-only"
            style="display:none">My Bookings</button>
        <button onclick="showSection('locations'); loadLocations();" id="nav-locations" class="auth-only"
            style="display:none">Locations</button>
        <button onclick="showSection('inbox'); loadInbox();" id="nav-inbox" class="auth-only"
            style="display:none">Inbox</button>
        <button onclick="logout()" id="nav-logout" class="auth-only" style="display:none">Logout</button>
    </nav>


    <!-- REGISTER -->
    <section id="register" class="active">
        <h2>Register</h2>

        <div class="form-group">
            <label>First Name</label>
            <input id="reg-fname" type="text">
        </div>
        <div class="form-group">
            <label>Surname</label>
            <input id="reg-surname" type="text">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input id="reg-email" type="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input id="reg-password" type="password">
        </div>

        <button type="submit" onclick="register()">Register</button>
        <div id="reg-msg"></div>
    </section>


    <!-- LOGIN -->
    <section id="login">
        <h2>Login</h2>

        <div class="form-group">
            <label>Email</label>
            <input id="login-email" type="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input id="login-password" type="password">
        </div>

        <button type="submit" onclick="login()">Login</button>
        <div id="login-msg"></div>
    </section>


    <!-- BOOK A CAB -->
    <section id="book">
        <h2>Book a Cab</h2>

        <!-- Route labels -->
        <div class="form-group">
            <label>Start Location</label>
            <input id="book-start" type="text" placeholder="e.g. Valletta">
        </div>
        <div class="form-group">
            <label>End Location</label>
            <input id="book-end" type="text" placeholder="e.g. Sliema">
        </div>

        <!-- Departure coordinates -->
        <div class="form-group">
            <label>Start Latitude</label>
            <input id="book-dep-lat" type="number" step="any" placeholder="35.8989">
        </div>
        <div class="form-group">
            <label>Start Longitude</label>
            <input id="book-dep-lng" type="number" step="any" placeholder="14.5146">
        </div>

        <!-- Arrival coordinates -->
        <div class="form-group">
            <label>End Latitude</label>
            <input id="book-arr-lat" type="number" step="any" placeholder="35.9042">
        </div>
        <div class="form-group">
            <label>End Longitude</label>
            <input id="book-arr-lng" type="number" step="any" placeholder="14.5023">
        </div>

        <!-- Booking details -->
        <div class="form-group">
            <label>Date & Time</label>
            <input id="book-datetime" type="datetime-local">
        </div>
        <div class="form-group">
            <label>Passengers (max 8)</label>
            <input id="book-passengers" type="number" min="1" max="8" value="1">
        </div>
        <div class="form-group">
            <label>Cab Type</label>
            <select id="book-cabtype">
                <option>Economic</option>
                <option>Premium</option>
                <option>Executive</option>
            </select>
        </div>

        <button class="btn" onclick="estimateFare()">Get Fare Estimate</button>
        <div id="fare-estimate"></div>

        <!-- Hidden until a fare estimate is ready -->
        <button type="submit" id="confirm-btn" onclick="confirmBooking()" style="display:none">Confirm & Pay</button>
        <div id="book-msg"></div>
    </section>


    <!-- MY BOOKINGS -->
    <section id="bookings">
        <h2>My Bookings</h2>

        <h3>Current / Upcoming</h3>
        <div id="current-bookings"><em>Loading...</em></div>

        <h3>Past</h3>
        <div id="past-bookings"><em>Loading...</em></div>
    </section>


    <!-- FAVOURITE LOCATIONS -->
    <section id="locations">
        <h2>Favourite Pickup Locations</h2>

        <div class="form-group">
            <label>Name</label>
            <input id="loc-name" type="text" placeholder="Home">
        </div>
        <div class="form-group">
            <label>Address</label>
            <input id="loc-address" type="text" placeholder="123 Main St">
        </div>
        <div class="form-group">
            <label>Latitude</label>
            <input id="loc-lat" type="number" step="any">
        </div>
        <div class="form-group">
            <label>Longitude</label>
            <input id="loc-lng" type="number" step="any">
        </div>

        <button type="submit" onclick="addLocation()">Add Location</button>
        <div id="loc-msg"></div>

        <hr>
        <div id="locations-list"></div>
    </section>


    <!-- INBOX -->
    <section id="inbox">
        <h2>Inbox</h2>
        <button class="btn" onclick="loadInbox()">Refresh</button>
        <div id="inbox-list" style="margin-top:12px;"></div>
    </section>


    <script>
        const GATEWAY = 'http://localhost:5000';

        let currentUserId = null;
        let lastFareEstimate = null;  // euros; kept so confirmBooking() can forward it to the payment service
        let lastFareBreakdown = null;


        //  Section / auth helpers 

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');

            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-' + id)?.classList.add('active');
        }

        function setLoggedIn(userId, firstName) {
            currentUserId = userId;
            document.getElementById('user-info').textContent = `Logged in as: ${firstName}`;
            document.querySelectorAll('.auth-only').forEach(el => el.style.display = '');
            document.getElementById('nav-register').style.display = 'none';
            document.getElementById('nav-login').style.display = 'none';
            showSection('book');
        }

        function logout() {
            currentUserId = null;
            document.getElementById('user-info').textContent = '';
            document.querySelectorAll('.auth-only').forEach(el => el.style.display = 'none');
            document.getElementById('nav-register').style.display = '';
            document.getElementById('nav-login').style.display = '';
            showSection('login');
        }


        //  Auth 

        async function register() {
            const msg = document.getElementById('reg-msg');
            msg.textContent = '';

            const body = {
                firstName: document.getElementById('reg-fname').value,
                surname: document.getElementById('reg-surname').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            };

            try {
                const res = await fetch(`${GATEWAY}/api/customers/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || JSON.stringify(data));

                msg.textContent = 'Registered - please login.';
                msg.className = 'success';
                showSection('login');
            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'error';
            }
        }

        async function login() {
            const msg = document.getElementById('login-msg');
            msg.textContent = '';

            const body = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };

            try {
                const res = await fetch(`${GATEWAY}/api/customers/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || JSON.stringify(data));

                setLoggedIn(data.userId, data.firstName || '');
                msg.textContent = '';
                msg.className = '';
            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'error';
            }
        }


        //  Booking 

        function formatMoney(amount) {
            return `€${Number(amount).toFixed(2)}`;
        }

        function getCabMultiplier(cabType) {
            const cabMultipliers = { Economic: 1, Premium: 1.2, Executive: 1.4 };
            return cabMultipliers[cabType] || 1;
        }

        function getTimeMultiplier(dateTime) {
            const hour = new Date(dateTime).getHours();
            return hour >= 8 ? 1 : 1.2;
        }

        function getPassengerMultiplier(passengers) {
            if (passengers >= 5 && passengers <= 8) return 2;
            if (passengers > 8) throw new Error('Maximum 8 passengers allowed');
            return 1;
        }

        function buildFareBreakdown(baseFare, cabType, dateTime, passengers, hasDiscount) {
            const cabMultiplier = getCabMultiplier(cabType);
            const timeMultiplier = getTimeMultiplier(dateTime);
            const passengerMultiplier = getPassengerMultiplier(passengers);
            const discountMultiplier = hasDiscount ? 0.9 : 1;

            const cabSubtotal = baseFare * cabMultiplier;
            const timeSubtotal = cabSubtotal * timeMultiplier;
            const passengerSubtotal = timeSubtotal * passengerMultiplier;
            const total = passengerSubtotal * discountMultiplier;

            return {
                baseFare,
                cabType,
                cabMultiplier,
                cabSubtotal,
                cabExtra: cabSubtotal - baseFare,
                timeMultiplier,
                timeSubtotal,
                timeExtra: timeSubtotal - cabSubtotal,
                passengerMultiplier,
                passengerSubtotal,
                passengerExtra: passengerSubtotal - timeSubtotal,
                discountMultiplier,
                discountSubtotal: total,
                discountExtra: total - passengerSubtotal,
                total
            };
        }

        function renderFareBreakdown(breakdown, distanceText, discountLabel) {
            const timeLabel = breakdown.timeMultiplier === 1.2 ? 'Night surcharge' : 'Daytime rate';
            const passengerLabel = breakdown.passengerMultiplier === 2 ? 'Passenger surcharge' : 'Passenger count';
            const discountText = breakdown.discountMultiplier < 1
                ? `${discountLabel} (${Math.round((1 - breakdown.discountMultiplier) * 100)}% off)`
                : 'No discount applied';

            return `
                <div class="fare-breakdown">
                    <h4>Fare breakdown${distanceText ? ` ${distanceText}` : ''}</h4>
                    <div class="row"><span>Base fare</span><strong>${formatMoney(breakdown.baseFare)}</strong></div>
                    <div class="row"><span>Cab type (${breakdown.cabType} x ${breakdown.cabMultiplier})</span><strong>${breakdown.cabExtra >= 0 ? '+' : ''}${formatMoney(breakdown.cabExtra)}</strong></div>
                    <div class="row"><span>${timeLabel} (x ${breakdown.timeMultiplier})</span><strong>${breakdown.timeExtra >= 0 ? '+' : ''}${formatMoney(breakdown.timeExtra)}</strong></div>
                    <div class="row"><span>${passengerLabel} (x ${breakdown.passengerMultiplier})</span><strong>${breakdown.passengerExtra >= 0 ? '+' : ''}${formatMoney(breakdown.passengerExtra)}</strong></div>
                    <div class="row"><span>${discountText} (x ${breakdown.discountMultiplier})</span><strong>${breakdown.discountExtra >= 0 ? '+' : ''}${formatMoney(breakdown.discountExtra)}</strong></div>
                    <div class="row total"><span>Estimated total</span><strong>${formatMoney(breakdown.total)}</strong></div>
                </div>
            `;
        }

        async function estimateFare() {
            const msg = document.getElementById('fare-estimate');
            msg.textContent = 'Estimating...';

            const dep_lat = document.getElementById('book-dep-lat').value;
            const dep_lng = document.getElementById('book-dep-lng').value;
            const arr_lat = document.getElementById('book-arr-lat').value;
            const arr_lng = document.getElementById('book-arr-lng').value;
            const dateTime = document.getElementById('book-datetime').value;

            if (!dateTime) {
                msg.textContent = 'Please choose a date and time first.';
                msg.className = 'error';
                return;
            }

            try {
                const url = `${GATEWAY}/api/fare/fare`
                    + `?dep_lat=${encodeURIComponent(dep_lat)}`
                    + `&dep_lng=${encodeURIComponent(dep_lng)}`
                    + `&arr_lat=${encodeURIComponent(arr_lat)}`
                    + `&arr_lng=${encodeURIComponent(arr_lng)}`;

                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || JSON.stringify(data));

                // Response shape: { baseFare: { journey: { fares: [...], distance } } }
                // Pick the first fare entry that carries a numeric price (some entries use "n/a").
                const fares = data.baseFare.journey.fares;
                const fareEntry = fares.find(f => Number.isFinite(f.price_in_cents));
                if (!fareEntry) throw new Error('Unable to read fare estimate from the response.');

                lastFareEstimate = fareEntry.price_in_cents / 100;

                const { distance } = data.baseFare.journey;
                const distanceText = distance ? ` (${distance} km)` : '';
                const cabType = document.getElementById('book-cabtype').value;
                const passengers = Number(document.getElementById('book-passengers').value);

                let hasDiscount = false;
                let discountLabel = 'Discount';
                if (currentUserId) {
                    const userRes = await fetch(`${GATEWAY}/api/customers/users/${currentUserId}`);
                    const user = await userRes.json();
                    hasDiscount = user.discountApplied === true;
                    discountLabel = hasDiscount ? 'Customer discount' : 'Discount';
                }

                lastFareBreakdown = buildFareBreakdown(lastFareEstimate, cabType, dateTime, passengers, hasDiscount);

                msg.innerHTML = renderFareBreakdown(lastFareBreakdown, distanceText, discountLabel);
                msg.className = '';
                document.getElementById('confirm-btn').style.display = '';
            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'error';
            }
        }

        async function confirmBooking() {
            const msg = document.getElementById('book-msg');
            msg.textContent = '';

            if (!currentUserId) { msg.textContent = 'Please login first.'; msg.className = 'error'; return; }
            if (!lastFareEstimate) { msg.textContent = 'Please get a fare estimate first.'; msg.className = 'error'; return; }

            const booking = {
                userId: currentUserId,
                startLocation: document.getElementById('book-start').value,
                endLocation: document.getElementById('book-end').value,
                dateTime: document.getElementById('book-datetime').value,
                passengers: Number(document.getElementById('book-passengers').value),
                cabType: document.getElementById('book-cabtype').value
            };

            try {
                // 1. Create the booking
                const res = await fetch(`${GATEWAY}/api/bookings/bookings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(booking)
                });
                const bookingData = await res.json();
                if (!res.ok) throw new Error(bookingData.error || JSON.stringify(bookingData));

                // 2. Check whether the user has a discount applied
                const userRes = await fetch(`${GATEWAY}/api/customers/users/${currentUserId}`);
                const user = await userRes.json();
                const hasDiscount = user.discountApplied === true;

                // 3. Process payment
                const paymentBody = {
                    bookingId: bookingData._id,
                    userId: currentUserId,
                    baseFare: lastFareEstimate,
                    cabType: booking.cabType,
                    passengers: booking.passengers,
                    bookingDateTime: booking.dateTime,
                    hasDiscount
                };

                const payRes = await fetch(`${GATEWAY}/api/payments/payments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(paymentBody)
                });
                const payData = await payRes.json();
                if (!payRes.ok) throw new Error(payData.error || JSON.stringify(payData));

                const finalTotal = payData.totalPrice ?? payData.breakdown?.totalPrice ?? payData.breakdown?.total ?? payData.breakdown?.discountSubtotal;
                msg.innerHTML = `Booking confirmed. Total paid: ${formatMoney(finalTotal || 0)}${lastFareBreakdown ? `<br><span style="color:#555">Base fare was ${formatMoney(lastFareBreakdown.baseFare)} before multipliers and discount.</span>` : ''}`;
                msg.className = 'success';
                document.getElementById('confirm-btn').style.display = 'none';
                loadBookings();
            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'error';
            }
        }

        async function loadBookings() {
            if (!currentUserId) return;

            try {
                const curRes = await fetch(`${GATEWAY}/api/bookings/bookings/user/${currentUserId}/current`);
                const pastRes = await fetch(`${GATEWAY}/api/bookings/bookings/user/${currentUserId}/past`);
                const cur = await curRes.json();
                const past = await pastRes.json();

                const toCard = b =>
                    `<div class="card">${b.startLocation} → ${b.endLocation}<br/>` +
                    `${new Date(b.dateTime).toLocaleString()} - ${b.cabType}</div>`;

                document.getElementById('current-bookings').innerHTML =
                    cur.length ? cur.map(toCard).join('') : '<em>No current bookings</em>';
                document.getElementById('past-bookings').innerHTML =
                    past.length ? past.map(toCard).join('') : '<em>No past bookings</em>';
            } catch (err) {
                console.error(err);
            }
        }


        //  Locations

        async function addLocation() {
            const msg = document.getElementById('loc-msg');
            msg.textContent = '';

            if (!currentUserId) { msg.textContent = 'Login first'; msg.className = 'error'; return; }

            const body = {
                userId: currentUserId,
                name: document.getElementById('loc-name').value,
                address: document.getElementById('loc-address').value,
                lat: Number(document.getElementById('loc-lat').value),
                lng: Number(document.getElementById('loc-lng').value)
            };

            try {
                const res = await fetch(`${GATEWAY}/api/locations/locations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || JSON.stringify(data));

                msg.textContent = 'Location added';
                msg.className = 'success';
                loadLocations();
            } catch (err) {
                msg.textContent = err.message;
                msg.className = 'error';
            }
        }

        async function loadLocations() {
            if (!currentUserId) return;

            try {
                const res = await fetch(`${GATEWAY}/api/locations/locations/user/${currentUserId}`);
                const list = await res.json();

                const toCard = l =>
                    `<div class="card">` +
                    `${l.name} - ${l.address}<br/>[${l.lat}, ${l.lng}] ` +
                    `<button onclick="getWeather('${l._id}', this)">Weather</button> ` +
                    `<button onclick="deleteLocation('${l._id}')">Delete</button>` +
                    `</div>`;

                document.getElementById('locations-list').innerHTML =
                    list.length ? list.map(toCard).join('') : '<em>No locations</em>';
            } catch (err) {
                console.error(err);
            }
        }

        async function getWeather(locationId, btn) {
            try {
                btn.textContent = 'Loading...';

                const res = await fetch(`${GATEWAY}/api/locations/locations/${locationId}/weather`);
                const data = await res.json();

                const locationName = typeof data.location === 'string'
                    ? data.location
                    : data.location?.name ?? 'Unknown location';

                const cur = data.weather || data.current || {};
                const condition = cur.condition || {};

                const weatherText = `
                    Weather at ${locationName}
                    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
                    Condition:    ${condition.text ?? 'Unavailable'}
                    Temperature:  ${cur.temp_c ?? 'Unavailable'}°C (feels like ${cur.feelslike_c ?? 'Unavailable'}°C)
                    Humidity:     ${cur.humidity ?? 'Unavailable'}%
                    Wind:         ${cur.wind_kph ?? 'Unavailable'} km/h (${cur.wind_dir ?? 'n/a'})
                    Visibility:   ${cur.vis_km ?? 'Unavailable'} km
                    Pressure:     ${cur.pressure_mb ?? 'Unavailable'} mb
                    Last updated: ${cur.last_updated ?? 'Unavailable'}
                `;
                alert(weatherText);
                btn.textContent = 'Weather';
            } catch (err) {
                alert(err.message);
                btn.textContent = 'Weather';
            }
        }

        async function deleteLocation(locationId) {
            try {
                const res = await fetch(`${GATEWAY}/api/locations/locations/${locationId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete');
                loadLocations();
            } catch (err) {
                alert(err.message);
            }
        }


        //  Inbox

        async function loadInbox() {
            if (!currentUserId) return;

            try {
                const res = await fetch(`${GATEWAY}/api/customers/users/${currentUserId}/notifications`);
                const list = await res.json();

                const toCard = n =>
                    `<div class="card">${n.message} <br/>` +
                    `<small>${new Date(n.createdAt).toLocaleString()}</small></div>`;

                document.getElementById('inbox-list').innerHTML =
                    list.length ? list.map(toCard).join('') : '<em>No notifications</em>';
            } catch (err) {
                console.error(err);
            }
        }


        //  Boot 

        showSection('register');
    </script>

    <script src="autofill.js"></script>
</body>

</html>
